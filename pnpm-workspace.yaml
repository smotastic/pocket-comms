catalogMode: strict

cleanupUnusedCatalogs: true

packages:
  - 'apps/**'
  - 'packages/**'
  - 'blueprints/**'

# Every external dependency is pinned here once (`.syncpackrc.json` enforces `catalog:` in
# every manifest).
catalog:
  # Runtime (Effect). All Effect packages move together, pinned to one exact release candidate
  # until Effect 4.0 is stable (ADR 0002).
  '@effect/platform-node': 4.0.0-rc.118
  '@effect/vitest': 4.0.0-rc.118
  effect: 4.0.0-rc.118

  # Dev dependencies (Nx). Pinned to a beta, because `@effect/vitest` needs Vitest 5 and no stable
  # Nx release supports it yet. Move to the first stable release that does.
  '@nx/eslint': 23.3.0-beta.7
  '@nx/eslint-plugin': 23.3.0-beta.7
  '@nx/js': 23.3.0-beta.7
  '@nx/vitest': 23.3.0-beta.7
  nx: 23.3.0-beta.7

  # TypeScript
  '@effect/language-service': ~0.87.3
  '@typescript-eslint/eslint-plugin': ^8.34.0
  '@typescript-eslint/parser': ^8.34.0
  '@types/node': ^26.1.1
  typescript: ~6.0.3
  typescript-eslint: ~8.61.0

  # The brainstorm chat's agent runtime (ADR 0012), pinned to the version pocket-learning runs.
  '@earendil-works/pi-agent-core': 1.4.0
  '@earendil-works/pi-ai': 1.4.0
  '@types/proper-lockfile': 4.1.4
  proper-lockfile: 4.1.2
  typebox: 1.3.27

  # Web Push to the owner's devices (spec 018).
  '@types/web-push': 3.6.4
  web-push: 3.6.7

  # Web (React)
  '@types/react': ~19.3.0
  '@types/react-dom': ~19.3.0
  react: ~19.3.1
  react-dom: ~19.3.1
  react-markdown: ~10.1.0
  remark-gfm: ~4.0.1
  '@tanstack/react-query': ~5.90.21
  '@tanstack/react-router': ~1.170.46
  '@tanstack/router-cli': ~1.167.46
  '@tanstack/router-plugin': ~1.168.48

  # Testing & linting
  '@testing-library/dom': ^10.4.0
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  axe-core: ~4.14.0
  jsdom: ^30.1.3
  '@eslint/js': ~10.0.1
  '@vitest/coverage-v8': ~5.0.2
  dependency-cruiser: ~17.4.3
  eslint: ~10.5.0
  stylelint: ~17.16.0
  stylelint-declaration-strict-value: ~1.12.1
  vitest: ~5.0.2

  # Component catalog (ADR 0009). Ladle bundles its own Vite 6 next to the workspace Vite.
  '@ladle/react': ~5.1.1

  # Build & bundling
  '@vitejs/plugin-react': ~6.1.2
  vite: ~8.0.16

  # Design tokens
  style-dictionary: ~5.7.0

  # Tooling
  '@redocly/cli': ~2.55.0
  husky: ^9.1.7
  prettier: ~3.8.4
  tslib: ^2.8.0
  syncpack: ~15.3.2

allowBuilds:
  '@google/genai': false
  '@scarf/scarf': false
  '@swc/core': false
  cpu-features: false
  esbuild: true
  msw: false
  nx: true
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@effect/language-service@0.87.3'
  - '@nx/devkit@23.3.0-beta.7'
  - '@nx/eslint-plugin@23.3.0-beta.7'
  - '@nx/eslint@23.3.0-beta.7'
  - '@nx/js@23.3.0-beta.7'
  - '@nx/nx-darwin-arm64@23.3.0-beta.7'
  - '@nx/nx-darwin-x64@23.3.0-beta.7'
  - '@nx/nx-freebsd-x64@23.3.0-beta.7'
  - '@nx/nx-linux-arm-gnueabihf@23.3.0-beta.7'
  - '@nx/nx-linux-arm64-gnu@23.3.0-beta.7'
  - '@nx/nx-linux-arm64-musl@23.3.0-beta.7'
  - '@nx/nx-linux-x64-gnu@23.3.0-beta.7'
  - '@nx/nx-linux-x64-musl@23.3.0-beta.7'
  - '@nx/nx-win32-arm64-msvc@23.3.0-beta.7'
  - '@nx/nx-win32-x64-msvc@23.3.0-beta.7'
  - '@nx/vitest@23.3.0-beta.7'
  - '@nx/workspace@23.3.0-beta.7'
  - '@redocly/cli@2.55.0'
  - nx@23.3.0-beta.7
  - '@testcontainers/postgresql@12.2.0'
  - testcontainers@12.2.0
