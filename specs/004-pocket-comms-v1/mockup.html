<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>pocket-comms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column; overview list -> docked conversation page with the composer pinned to the bottom.
   Single dark theme on purpose: it mirrors the pocket design system's "Midnight" tokens. */
:root {
  color-scheme: dark;
  --bg-canvas: #09090b;
  --bg-glow: #1d2040;
  --bg-surface: #131316;
  --bg-sheet: #0f0f12;
  --bg-tile: rgba(255,255,255,.03);
  --bg-bar: rgba(9,9,11,.8);
  --bg-accent: #7c8cff;
  --bg-accent-soft: #1b1d2e;
  --bg-danger-soft: #3a1d1f;
  --bg-success-soft: #0b2a1c;
  --text: #ededef;
  --text-muted: #9a9aa3;
  --text-faint: #63636c;
  --text-accent: #a5b0ff;
  --text-on-accent: #09090b;
  --success: #3ecf8e;
  --danger: #f87171;
  --border: #26262b;
  --border-control: #63636c;
  --border-accent: #2f3458;
  --focus: #7c8cff;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 60% at 50% -10%, var(--bg-glow), var(--bg-canvas) 60%) var(--bg-canvas);
  background-attachment: fixed;
  color: var(--text);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-canvas); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; padding-block: 12px;
  background: var(--bg-bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.bar h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.bar .sub { font-size: 12px; color: var(--text-muted); }
.grow { flex: 1; min-width: 0; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(62,207,142,.15); }
.mock { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-accent); background: var(--bg-accent-soft); border: 1px solid var(--border-accent); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); background: var(--bg-tile); cursor: pointer; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }

/* overview */
.overview { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 22px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.label .count { color: var(--text-faint); font-weight: 500; }
.group-path { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.agent {
  display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center;
  width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r-md);
  background: var(--bg-tile); border: 1px solid var(--border); cursor: pointer;
}
.agent:active { background: rgba(255,255,255,.05); }
.agent.attn-blocked { border-color: rgba(248,113,113,.45); background: linear-gradient(var(--bg-danger-soft), rgba(58,29,31,.35)); }
.agent.attn-done { border-color: rgba(62,207,142,.35); }
.kind { grid-row: span 2; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font: 600 12px var(--font-mono); }
.kind.claude { background: #2a1d14; color: #f0a46b; }
.kind.pi { background: #24230f; color: #e8dd7a; }
.agent .name { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent .title { grid-column: 2 / 4; font-size: 13px; color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent .title b { color: var(--text); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-working { color: var(--text-accent); background: var(--bg-accent-soft); }
.s-working i { animation: pulse 1.4s ease-in-out infinite; }
.s-blocked { color: var(--danger); background: var(--bg-danger-soft); }
.s-done { color: var(--success); background: var(--bg-success-soft); }
.s-idle { color: var(--text-muted); background: rgba(255,255,255,.05); }
@keyframes pulse { 50% { opacity: .25; } }

/* conversation page */
.page { display: none; flex-direction: column; height: 100%; }
.app.show-convo .overview-wrap { display: none; }
.app.show-convo .page { display: flex; }
.app.show-convo { height: 100%; }
.page .bar { border-bottom: 1px solid var(--border); }
.seg { display: flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--bg-surface); border: 1px solid var(--border); }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg-accent-soft); color: var(--text-accent); }
.meta { display: flex; gap: 8px; align-items: center; padding-block: 8px; font-size: 12px; color: var(--text-faint); border-bottom: 1px solid var(--border); overflow: hidden; }
.meta code { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.log { padding-block: 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.you { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 14px; }
.you .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 2px; }
.reply { font-size: 15px; }
.reply p { margin: 0 0 8px; }
.reply p:last-child { margin: 0; }
.reply code, .tool code { font-family: var(--font-mono); font-size: 12.5px; background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 5px; }
.reply ul { margin: 0 0 8px; padding-left: 20px; }
.tool { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); padding: 6px 10px; border-radius: var(--r-sm); border: 1px dashed var(--border); min-width: 0; }
.tool .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .ok { color: var(--success); font-family: var(--font-mono); font-size: 12px; }
.tool .add { color: var(--success); font-family: var(--font-mono); font-size: 12px; }
.tool .del { color: var(--danger); font-family: var(--font-mono); font-size: 12px; }
.tools { display: flex; flex-direction: column; gap: 4px; }
.activity { display: flex; align-items: center; gap: 10px; color: var(--text-accent); font-size: 13px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--bg-accent); animation: pulse 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }

.screen { margin-block: 16px; padding: 12px; background: #050506; border: 1px solid var(--border); border-radius: var(--r-md); font: 12px/1.45 var(--font-mono); color: #c9c9d1; overflow-x: auto; white-space: pre; }
.screen .c1 { color: #f0a46b; } .screen .c2 { color: var(--text-faint); } .screen .c3 { color: var(--success); } .screen .c4 { color: var(--text-accent); }

/* question card (blocked) */
.question { border: 1px solid rgba(248,113,113,.45); background: var(--bg-danger-soft); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.question .q-h { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--danger); }
.question .cmd { font: 13px/1.45 var(--font-mono); background: rgba(0,0,0,.35); border-radius: var(--r-sm); padding: 8px 10px; overflow-x: auto; white-space: pre; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: center; text-align: left; padding: 11px 12px; border-radius: var(--r-md); border: 1px solid var(--border-control); background: rgba(9,9,11,.5); cursor: pointer; font-size: 14px; }
.opt kbd { font: 600 12px var(--font-mono); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: rgba(255,255,255,.08); flex: none; }
.opt:active { background: rgba(255,255,255,.08); }

/* bottom dock */
.dock { padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(rgba(9,9,11,0), var(--bg-canvas) 35%); display: flex; flex-direction: column; gap: 8px; }
.keys { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.key { flex: none; min-width: 44px; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border-control); background: var(--bg-surface); font: 500 13px var(--font-mono); cursor: pointer; position: relative; overflow: hidden; }
.key.danger { color: var(--danger); border-color: rgba(248,113,113,.4); }
.key .fill { position: absolute; inset: 0; background: rgba(248,113,113,.25); transform: scaleX(0); transform-origin: left; }
.key.holding .fill { transform: scaleX(1); transition: transform .6s linear; }
.composer { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 22px; border: 1px solid var(--border-control); background: var(--bg-sheet); }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; background: none; color: var(--text); font: 16px/1.4 var(--font-body); padding: 7px 0; max-height: 120px; outline: none; }
.composer textarea::placeholder { color: var(--text-faint); }
.send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bg-accent); color: var(--text-on-accent); display: grid; place-items: center; cursor: pointer; flex: none; }
.send:disabled { opacity: .35; }
.send svg { width: 18px; height: 18px; }
.hint { font-size: 13px; color: var(--text-muted); text-align: center; padding: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--bg-surface); border: 1px solid var(--border); padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; white-space: nowrap; }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="overview-wrap">
    <header class="bar gutter">
      <div class="grow">
        <h1>pocket-comms</h1>
        <div class="live"><i></i>Mac mini · live</div>
      </div>
      <span class="mock">Mockup · example data</span>
    </header>
    <main class="overview gutter" id="overview"></main>
  </div>

  <section class="page" id="page" aria-label="Agent conversation">
    <header class="bar gutter">
      <button class="iconbtn" id="back" aria-label="Back to all agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="grow">
        <h1 id="p-name"></h1>
        <div class="sub" id="p-status"></div>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="v-chat" aria-pressed="true">Chat</button>
        <button id="v-screen" aria-pressed="false">Screen</button>
      </div>
    </header>
    <div class="meta gutter"><span id="p-kind"></span>·<code id="p-cwd"></code></div>
    <div class="scroll" id="scroll"><div class="gutter" id="body"></div></div>
    <footer class="dock gutter" id="dock"></footer>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const agents = [
  { name: "picard-tanstack", kind: "pi", status: "blocked", ws: "pocket-factory", path: "~/.herdr/worktrees/pocket-factory/feat-web-tanstack", title: "Adopt TanStack Router and Query", ago: "now",
    log: [
      { you: "Read your brief and carry it out autonomously until its 'Done when' list is complete." },
      { reply: "<p>Read the brief and the ADR README. Plan:</p><ul><li>ADR 0007: TanStack Router + Query as the web base stack</li><li>Migrate <code>bookmarks/apps/web</code> to file-based routes</li><li>Wrap the Effect client in query functions</li></ul>" },
      { tools: [["Wrote", "docs/architecture/adr/0007-tanstack-web-stack.md", "+86", ""], ["Edited", "blueprints/bookmarks/apps/web/vite.config.ts", "+6", "−1"], ["Ran", "pnpm install", "ok"]] },
      { reply: "<p>Routes and queries are in. Pushing the branch so CI can run.</p>" },
    ],
    question: { cmd: "git push -u origin feat/web-tanstack", opts: ["Yes", "Yes, and don't ask again for git push", "No, tell Pi what to do instead"] } },
  { name: "nebula-ux-research", kind: "claude", status: "done", ws: "pocket-learning", path: "~/.herdr/worktrees/pocket-learning/feat-ux", title: "App UX research and improvements", ago: "4m",
    log: [
      { you: "Look at the lesson screen on a 390px viewport and list the three worst UX issues." },
      { tools: [["Ran", "agent-browser open localhost:4200", "ok"], ["Read", "apps/learning-web/src/Lesson.tsx", ""]] },
      { reply: "<p>The three worst issues on a 390px screen:</p><ul><li>The composer hides behind the iOS keyboard on the quiz card.</li><li>Tap targets in the card header are 28px; they should be at least 44px.</li><li>The progress bar jumps when the coach sheet opens.</li></ul><p>Want me to fix all three on this branch?</p>" },
    ] },
  { name: "spock-chat-kit", kind: "pi", status: "working", ws: "pocket-factory", path: "~/.herdr/worktrees/pocket-factory/feat-design-chat-kit", title: "Port chat components into the UI kit", ago: "12s",
    activity: "Running pnpm verify:local…",
    log: [
      { you: "Read your brief and carry it out autonomously until its 'Done when' list is complete." },
      { reply: "<p>Porting <code>Composer</code>, <code>Markdown</code>, <code>Activity</code>, <code>Sheet</code>, <code>DockedPage</code>, <code>IconButton</code> and <code>Avatar</code> from pocket-learning's <code>origin/master</code>. Coach-specific wording is removed.</p>" },
      { tools: [["Wrote", "packages/design/ui/src/composer/Composer.tsx", "+118", ""], ["Wrote", "packages/design/ui/src/sheet/Sheet.tsx", "+142", ""], ["Edited", "packages/design/ui/src/index.ts", "+9", ""], ["Ran", "pnpm nx test design-ui", "ok"]] },
    ] },
  { name: "kirk-ingestor-mvp", kind: "claude", status: "idle", ws: "pocket-home", path: "~/.herdr/worktrees/pocket-home/feat-ingestor-mvp", title: "Pocket-home ingestor MVP discussion", ago: "2h",
    log: [
      { you: "Summarise where we left the ingestor design." },
      { reply: "<p>We agreed on a pull-based ingestor with one adapter per source. Open point: whether retries live in the adapter or the scheduler.</p>" },
    ] },
  { name: "data-phone-workflow", kind: "claude", status: "working", ws: "setup", path: "~/Development/projects/setup", title: "Herdr and Orca phone workflow", ago: "now",
    activity: "Writing the pocket-comms mockup…",
    log: [
      { you: "hiw about we write our own webapp visualizing my herdr session which i can use on the phone?" },
      { reply: "<p>Herdr's socket API covers it: list agents, read output, send prompts and keys, subscribe to events.</p>" },
    ] },
];
const statusText = { working: "Working", blocked: "Needs you", done: "Done", idle: "Idle" };
const kindText = { claude: "Claude", pi: "Pi" };
let current = null, view = "chat";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function pill(s) { return `<span class="pill s-${s}"><i></i>${statusText[s]}</span>`; }
function row(a) {
  const sub = a.status === "working" && a.activity ? `<b>${esc(a.activity)}</b>` : a.status === "blocked" ? `<b>Asks to run</b> ${esc(a.question.cmd)}` : esc(a.title);
  return `<button class="agent ${a.status === "blocked" ? "attn-blocked" : a.status === "done" ? "attn-done" : ""}" data-name="${a.name}">
    <span class="kind ${a.kind}">${a.kind === "pi" ? "π" : "C"}</span>
    <span class="name">${a.name}</span>${pill(a.status)}
    <span class="title">${sub} · ${a.ago}</span></button>`;
}
function renderOverview() {
  const attn = agents.filter(a => a.status === "blocked" || a.status === "done");
  const rest = agents.filter(a => !attn.includes(a));
  const groups = {};
  rest.forEach(a => (groups[a.ws] ||= []).push(a));
  let html = "";
  if (attn.length) html += `<section><h2 class="label">Needs you <span class="count">${attn.length}</span></h2><div class="list">${attn.map(row).join("")}</div></section>`;
  for (const [ws, list] of Object.entries(groups)) {
    html += `<section><h2 class="label">${ws} <span class="count">${list.length}</span></h2><div class="list">${list.map(row).join("")}</div></section>`;
  }
  $("overview").innerHTML = html;
}
function toolLine([verb, path, a, b]) {
  const tail = a === "ok" ? `<span class="ok">✓</span>` : `${a ? `<span class="add">${a}</span>` : ""}${b ? `<span class="del">${b}</span>` : ""}`;
  return `<div class="tool"><span>${verb}</span><span class="t"><code>${esc(path)}</code></span>${tail}</div>`;
}
function renderChat(a) {
  let h = `<div class="log">`;
  for (const e of a.log) {
    if (e.you) h += `<div class="you"><div class="who">You</div>${esc(e.you)}</div>`;
    if (e.reply) h += `<div class="reply">${e.reply}</div>`;
    if (e.tools) h += `<div class="tools">${e.tools.map(toolLine).join("")}</div>`;
  }
  if (a.status === "working") h += `<div class="activity"><span class="dots"><i></i><i></i><i></i></span>${esc(a.activity || "Working…")}</div>`;
  if (a.status === "blocked") h += `<div class="question"><div class="q-h">● ${kindText[a.kind]} asks to run</div><div class="cmd">${esc(a.question.cmd)}</div><div class="opts">${a.question.opts.map((o, i) => `<button class="opt" data-opt="${i}"><kbd>${i + 1}</kbd>${esc(o)}</button>`).join("")}</div></div>`;
  return h + `</div>`;
}
function renderScreen(a) {
  const q = a.status === "blocked" ? `\n<span class="c1">╭─ Allow command? ─────────────────────────╮</span>\n<span class="c1">│</span> ${esc(a.question.cmd).padEnd(41)}<span class="c1">│</span>\n<span class="c1">│</span> <span class="c4">❯ 1. Yes</span>                                 <span class="c1">│</span>\n<span class="c1">│</span>   2. Yes, don't ask again               <span class="c1">│</span>\n<span class="c1">│</span>   3. No                                 <span class="c1">│</span>\n<span class="c1">╰──────────────────────────────────────────╯</span>` : "";
  return `<div class="screen"><span class="c2">~/…/${a.path.split("/").pop()}</span>
<span class="c3">●</span> ${esc(a.title)}
<span class="c2">  ⎿  ${a.log.length} turns · ${kindText[a.kind]}</span>
${a.status === "working" ? `\n<span class="c4">⠙ ${esc(a.activity || "Working")}</span>` : ""}${q}

<span class="c2">────────────────────────────────────────────</span>
<span class="c2"> ${kindText[a.kind]} · ${a.ws} · ctx 41%</span></div>`;
}
const keys = ["1", "2", "3", "↑", "↓", "Enter", "Esc"];
function renderDock(a) {
  let h = "";
  if (a.status === "blocked" || view === "screen") {
    h += `<div class="keys" role="group" aria-label="Keys">${keys.map(k => `<button class="key" data-key="${k}">${k}</button>`).join("")}<button class="key danger" id="ctrlc" aria-label="Hold to send Control C">Ctrl-C<span class="fill"></span></button></div>`;
  }
  if (a.status === "blocked" && view === "chat") h += `<div class="hint">Answer above to continue</div>`;
  else h += `<form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="Message ${a.name}" enterkeyhint="send"></textarea><button class="send" id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>`;
  $("dock").innerHTML = h;
  wireDock(a);
}
function renderPage() {
  const a = current;
  $("p-name").textContent = a.name;
  $("p-status").innerHTML = pill(a.status);
  $("p-kind").textContent = kindText[a.kind];
  $("p-cwd").textContent = a.path;
  $("v-chat").setAttribute("aria-pressed", view === "chat");
  $("v-screen").setAttribute("aria-pressed", view === "screen");
  $("body").innerHTML = view === "chat" ? renderChat(a) : renderScreen(a);
  renderDock(a);
  const s = $("scroll"); s.scrollTop = s.scrollHeight;
}
function open(name) {
  current = agents.find(a => a.name === name);
  if (current.status === "done") current.seen = true;
  view = "chat";
  $("app").classList.add("show-convo");
  renderPage();
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1600); }
function answer(i) {
  const a = current;
  a.log.push({ tools: [["Answered", `${i + 1}. ${a.question.opts[i]}`, "ok"]] });
  a.status = i === 2 ? "idle" : "working";
  a.activity = i === 2 ? null : "Pushing feat/web-tanstack…";
  a.ago = "now";
  toast(`Sent ${i + 1} to ${a.name}`);
  renderPage();
}
function wireDock(a) {
  document.querySelectorAll(".key[data-key]").forEach(b => b.onclick = () => {
    const k = b.dataset.key;
    if (a.status === "blocked" && /^[123]$/.test(k)) return answer(+k - 1);
    toast(`Sent ${k} to ${a.name}`);
  });
  const c = $("ctrlc");
  if (c) {
    let t;
    const start = e => { e.preventDefault(); c.classList.add("holding"); t = setTimeout(() => { c.classList.remove("holding"); toast(`Sent Ctrl-C to ${a.name}`); }, 600); };
    const stop = () => { clearTimeout(t); c.classList.remove("holding"); };
    c.addEventListener("pointerdown", start); ["pointerup", "pointerleave", "pointercancel"].forEach(ev => c.addEventListener(ev, stop));
    c.onclick = e => e.preventDefault();
  }
  const f = $("composer");
  if (!f) return;
  const ta = $("prompt"), send = $("send");
  ta.oninput = () => { send.disabled = !ta.value.trim(); ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
  ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); f.requestSubmit(); } };
  f.onsubmit = e => {
    e.preventDefault();
    const text = ta.value.trim(); if (!text) return;
    a.log.push({ you: text });
    a.status = "working"; a.activity = "Thinking…"; a.ago = "now";
    view = "chat"; renderPage();
    setTimeout(() => {
      if (current !== a || a.status !== "working") return;
      a.log.push({ reply: "<p>On it. (This is the mockup, so no agent received your message.)</p>" });
      a.status = "done"; a.activity = null; renderPage();
    }, 2200);
  };
}
$("overview").onclick = e => { const b = e.target.closest(".agent"); if (b) open(b.dataset.name); };
$("body").onclick = e => { const o = e.target.closest(".opt"); if (o) answer(+o.dataset.opt); };
$("back").onclick = () => {
  agents.forEach(a => { if (a.seen && a.status === "done") { a.status = "idle"; a.seen = false; } });
  $("app").classList.remove("show-convo"); current = null; renderOverview();
};
$("v-chat").onclick = () => { view = "chat"; renderPage(); };
$("v-screen").onclick = () => { view = "screen"; renderPage(); };
renderOverview();
</script>
</body>
</html>
