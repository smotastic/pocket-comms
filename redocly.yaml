# Repository rules for the published OpenAPI documents (ADR 0005): every operation, parameter and
# schema property carries a description and an example, and every operation that takes input
# declares an error response.
extends:
  - recommended

rules:
  operation-description: error
  parameter-description: error
  operation-4xx-response: error
  # The documents are served by each deployable; no server list is published.
  no-server-example.com: off
  no-empty-servers: off
  # Authentication is decided in a later ADR.
  security-defined: off
  # The documents are internal contracts; no license is published.
  info-license: off

  rule/property-description:
    subject:
      type: Schema
      property: description
    where:
      - subject:
          type: SchemaProperties
        assertions:
          defined: true
    message: Every schema property needs a description.
    assertions:
      defined: true

  rule/property-example:
    subject:
      type: Schema
      property: examples
    where:
      - subject:
          type: SchemaProperties
        assertions:
          defined: true
    message: Every schema property needs an example.
    assertions:
      defined: true

  rule/parameter-example:
    subject:
      type: Schema
      property: examples
    where:
      - subject:
          type: Parameter
        assertions:
          defined: true
    message: Every parameter needs an example.
    assertions:
      defined: true
