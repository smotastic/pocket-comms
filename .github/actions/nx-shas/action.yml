name: 'Nx base and head'
description: >
  Exports NX_BASE and NX_HEAD for `nx affected` from git alone, so it works on GitHub and Gitea
  (nrwl/nx-set-shas queries GitHub's Actions API). A pull request compares with its merge-base on
  the target branch; a push compares with the commit before the push, or with the parent commit
  when that is unknown (the first push of a branch reports an all-zero SHA). Needs a checkout with
  `fetch-depth: 0`.
outputs:
  base:
    description: 'The base commit (also exported as NX_BASE)'
    value: ${{ steps.shas.outputs.base }}
  head:
    description: 'The head commit (also exported as NX_HEAD)'
    value: ${{ steps.shas.outputs.head }}
runs:
  using: composite
  steps:
    - id: shas
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        head=$(git rev-parse HEAD)
        if [ "$EVENT_NAME" = pull_request ]; then
          base=$(git merge-base HEAD "origin/$BASE_REF")
        elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          base=$BEFORE
        elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
          base=$(git rev-parse HEAD~1)
        else
          # A root commit has no parent to compare with.
          base=$head
        fi
        echo "NX_BASE=$base" >> "$GITHUB_ENV"
        echo "NX_HEAD=$head" >> "$GITHUB_ENV"
        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "head=$head" >> "$GITHUB_OUTPUT"
        echo "NX_BASE=$base NX_HEAD=$head"
