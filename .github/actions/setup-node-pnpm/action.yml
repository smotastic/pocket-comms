name: 'Setup Node & pnpm'
description: >
  Sets up Node.js and pnpm (via Corepack) and installs dependencies, without
  relying on third-party marketplace actions (pnpm/action-setup is blocked by
  the org's "selected actions" policy which only allows GitHub-owned actions).
inputs:
  node-version:
    description: 'Node.js version to install'
    required: true
  registry-token:
    description: >
      A token with read:package for the Gitea npm registry of `.npmrc`, which serves
      `@smotastic/pocket-ci` to every repository but the one that holds its source
    required: false
    default: ''
  install-dependencies:
    description: 'Install workspace dependencies in the checkout'
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    # `corepack prepare` is redundant: Corepack resolves the `packageManager` pin
    # in package.json per invocation, so activating a range only added a registry call.
    - name: Enable Corepack
      shell: bash
      run: corepack enable
    # Written to the user config, so the token never lands in a repository file.
    - name: Authenticate to the package registry
      if: ${{ inputs.registry-token != '' }}
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        registry=$(pnpm config get @smotastic:registry)
        pnpm config set --location=global "${registry#http*:}:_authToken" "$REGISTRY_TOKEN"
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.store }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - name: Install dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
