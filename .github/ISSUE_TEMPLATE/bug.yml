name: Bug report
description: A behaviour that contradicts a spec or the expected result.
title: 'fix: <short description>'
labels: [bug]
body:
  - type: input
    id: spec
    attributes:
      label: Related spec
      description: The spec whose requirement is not met, if any.
      placeholder: specs/001-bookmarks-blueprint/spec.md
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
