name: Feature intent
description: Describe an intent for the spec-first workflow. The speckit-specify skill turns it into spec.md.
title: 'feat: <short intent>'
labels: [intent]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / intent (WHY)
      description: What is wrong or missing today, and for whom.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In scope and out of scope, one line each.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, as far as known.
