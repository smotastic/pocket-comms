name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same pull request or branch makes the running gate pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'
  # Two jobs share the runner VM's 4 CPUs. Without a bound, each job runs 3 Nx tasks.
  NX_PARALLEL: '2'

# The gate is one job (ADR 0012): one checkout and one install, then `pocket-ci verify` runs every
# check of the shared CI package `@smotastic/pocket-ci` and reports every failed step at the end.
# What runs is the package version in the lockfile, so a change to the gate is a dependency bump.
# Require the status check `CI / verify` on `master`.

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - uses: ./.github/actions/nx-shas
      - uses: ./.github/actions/nx-cache
      - run: pnpm exec pocket-ci verify
