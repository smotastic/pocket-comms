name: Release bookmarks

# Pushing a tag `bookmarks-vX.Y.Z` builds both bookmarks images and pushes them as `X.Y.Z` to the
# container registry. This workflow is not part of the CI gate; tagging a commit is the release
# decision. It needs the Actions variable REGISTRY_HOST (for example `localhost:3000`) and the
# Actions secret REGISTRY_TOKEN, a token of the repository owner with the `write:package` scope.

on:
  push:
    tags: ['bookmarks-v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push the bookmarks images
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_USER: ${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the version and image names
        shell: bash
        run: |
          version=${TAG#bookmarks-v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not bookmarks-vX.Y.Z."
            exit 1
          fi
          if [ -z "$REGISTRY_HOST" ]; then
            echo "::error::Set the Actions variable REGISTRY_HOST."
            exit 1
          fi
          prefix="$REGISTRY_HOST/${REGISTRY_USER,,}"
          {
            echo "SERVER_IMAGE=$prefix/bookmarks-server:$version"
            echo "WEB_IMAGE=$prefix/bookmarks-web:$version"
          } >> "$GITHUB_ENV"
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USER" --password-stdin
      - name: Build bookmarks-server
        run: docker build -f blueprints/bookmarks/apps/server/Dockerfile -t "$SERVER_IMAGE" .
      - name: Build bookmarks-web
        run: docker build -f blueprints/bookmarks/apps/web/Dockerfile -t "$WEB_IMAGE" .
      - name: Push the images
        run: |
          docker push "$SERVER_IMAGE"
          docker push "$WEB_IMAGE"
      # The runner shares the host's Docker, so drop the local tags and the credentials.
      - name: Clean up
        if: ${{ always() }}
        run: |
          docker image rm --force "$SERVER_IMAGE" "$WEB_IMAGE" || true
          docker logout "$REGISTRY_HOST" || true
