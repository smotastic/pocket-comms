# Local PostgreSQL for the bookmarks blueprint. For developer machines only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookmarks
      POSTGRES_PASSWORD: bookmarks
      POSTGRES_DB: bookmarks
    ports:
      - '5432:5432'
    # A named volume survives `docker compose down`; only `down -v` (`pnpm dev:reset`) wipes it.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bookmarks']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
